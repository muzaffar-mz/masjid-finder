name: CD - Deploy Backend Dev
on:
  workflow_dispatch:
  push:
    branches:
      - develop
jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: masjid_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      - name: Set build number
        id: build-number
        run: echo "BUILD_NUMBER=$(date '+%d.%m.%Y.%H.%M.%S')" >> $GITHUB_OUTPUT
      - name: Build, test & push image with Jib
        run: mvn -ntp -B verify -Ddocker.image.tag=${{ steps.build-number.outputs.BUILD_NUMBER }} jib:build
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_TAG,DB_USER,DB_PASSWORD,DB_NAME,TELEGRAM_USER_TOKEN,TELEGRAM_ADMIN_TOKEN
          script: |
            cd ~/masjid-bot
            docker compose pull app
            docker compose up -d
            docker image prune -af
        env:
          APP_TAG: ${{ steps.build-number.outputs.BUILD_NUMBER }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ vars.DB_NAME }}
          TELEGRAM_USER_TOKEN: ${{ secrets.TELEGRAM_USER_TOKEN }}
          TELEGRAM_ADMIN_TOKEN: ${{ secrets.TELEGRAM_ADMIN_TOKEN }}
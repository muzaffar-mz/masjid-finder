databaseChangeLog:
  - changeSet:
      id: create-text-table
      author: muzaffar
      changes:
        - createTable:
            tableName: text
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: language
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: command_button
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: is_formatted
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: date_created
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_updated
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP